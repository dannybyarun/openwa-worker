name = "openwa-worker"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# One Durable Object per WhatsApp session. The DO owns the baileys socket, the
# auth state (creds + signal keys) in its storage, and the message cursor. In lazy
# mode the socket is only open inside a /wake window (see README).
[[durable_objects.bindings]]
name = "WHATSAPP_SESSION"
class_name = "WhatsAppSession"

# A single global Durable Object that tracks which session names exist (there is
# no way to enumerate Durable Objects, so the index lives here instead of KV —
# this keeps the project deployable with zero account-side setup).
[[durable_objects.bindings]]
name = "SESSION_REGISTRY"
class_name = "SessionRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WhatsAppSession", "SessionRegistry"]

# Optional tunables. Defaults live in src/env.ts; set them under [vars] or as secrets.
# IDLE_TTL_MS = "60000"        # connected window per wake (5 s – 15 min)
# DAILY_WAKE_LIMIT = "300"     # connects/session/UTC day; 0 disables the cap
# INBOUND_WEBHOOK_URL = "https://example.com/hook"
# INBOUND_WEBHOOK_TOKEN = "..."

# Build the React UI into ./ui/dist before Wrangler uploads the assets.
[build]
command = "npm run build"

# Static UI. Served on `/` (anything outside /api and /health) by Cloudflare's
# asset pipeline; the API lives on `/api/*`. `npm run build` (run automatically
# by the [build] hook above) compiles the Vite app in ./ui.
[assets]
directory = "./ui/dist"
binding = "ASSETS"