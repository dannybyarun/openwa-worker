<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenWA · WhatsApp gateway</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1d212b; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #8b93a3; --accent: #25d366; --accent-2: #128c7e;
    --danger: #e05252; --warn: #e8b64c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
  header h1 span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .config { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; margin-left: auto; }
  .config label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); }
  input, button {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px;
  }
  input:focus { outline: none; border-color: var(--accent-2); }
  input[type="password"] { letter-spacing: 2px; }
  button { cursor: pointer; transition: filter .12s; }
  button:hover { filter: brightness(1.15); }
  button:disabled { opacity: .45; cursor: default; filter: none; }
  button.primary { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
  button.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  main { display: grid; grid-template-columns: 240px 1fr 1fr; gap: 16px; padding: 16px 20px; align-items: start; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  aside, section {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px;
  }
  aside h2, section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 10px; }
  .filter-row { margin-bottom: 8px; }
  .filter-row select { width: 100%; }
  #session-list { display: flex; flex-direction: column; gap: 6px; max-height: 46vh; overflow-y: auto; }
  .session {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 8px; cursor: pointer; background: var(--panel-2);
  }
  .session.active { border-color: var(--accent-2); }
  .session .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session .del { border: none; background: none; color: var(--muted); padding: 2px 6px; }
  .session .del:hover { color: var(--danger); }
  .chip {
    font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border);
    color: var(--muted); white-space: nowrap; text-transform: capitalize;
  }
  .chip.connected { color: #fff; background: var(--accent-2); border-color: var(--accent-2); }
  .chip.qr, .chip.connecting { color: var(--warn); border-color: var(--warn); }
  .chip.idle { color: var(--muted); border-color: var(--border); }
  .chip.closed, .chip.loggedOut { color: var(--danger); border-color: var(--danger); }
  #create-form { display: flex; gap: 6px; margin-top: 10px; }
  #create-form input { flex: 1; }
  #session-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  #session-head h2 { margin: 0; font-size: 16px; text-transform: none; letter-spacing: 0; color: var(--text); }
  #session-actions { margin-left: auto; display: flex; gap: 6px; }
  #qr-panel { text-align: center; padding: 10px 0; }
  #qr-panel img { image-rendering: pixelated; width: 260px; height: 260px; background: #fff; border-radius: 8px; }
  #qr-hint { color: var(--muted); font-size: 13px; }
  #conn-note { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0; }
  #msg-list {
    display: flex; flex-direction: column; gap: 8px; max-height: 52vh; overflow-y: auto;
    font-size: 13px; padding-right: 4px;
  }
  .msg { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--panel-2); }
  .msg .meta { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 11px; margin-bottom: 3px; }
  .msg .meta .from-me { color: var(--accent); }
  .msg .text { white-space: pre-wrap; word-break: break-word; }
  .msg .type-tag { color: var(--warn); }
  #send-form { display: flex; gap: 6px; margin-top: 10px; }
  #send-chat { flex: 2; }
  #send-text { flex: 3; }
  #send-form button { flex: 0 0 auto; }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; }
  #notice { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 16px; font-size: 13px; display: none;
    max-width: 80vw; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  #notice.show { display: block; }
</style>
</head>
<body>

<header>
  <h1>OpenWA<span>WhatsApp gateway · Cloudflare Workers</span></h1>
  <div class="config">
    <label>Worker URL
      <input id="cfg-url" placeholder="https://your-worker.example.workers.dev" size="34" autocomplete="off">
    </label>
    <label>API token
      <input id="cfg-token" type="password" placeholder="optional" autocomplete="off">
    </label>
    <button id="cfg-save">Save</button>
  </div>
</header>

<main>
  <aside>
    <h2>Sessions</h2>
    <div id="session-list"><div class="empty">No sessions yet</div></div>
    <form id="create-form">
      <input id="new-name" placeholder="new session name" pattern="[A-Za-z0-9_-]{1,64}" autocomplete="off">
      <button type="submit" class="primary">Create</button>
    </form>
  </aside>

  <section id="session-view" hidden>
    <div id="session-head">
      <h2 id="session-title">—</h2>
      <span id="status-chip" class="chip">—</span>
      <div id="session-actions">
        <button id="btn-start">Wake</button>
        <button id="btn-refresh">Refresh</button>
        <button id="btn-logout" class="danger">Logout</button>
      </div>
    </div>
    <div id="qr-panel" hidden>
      <img id="qr-img" alt="WhatsApp QR code">
      <p id="qr-hint">Scan with WhatsApp → Linked Devices → Link a Device</p>
    </div>
    <div id="conn-note"></div>
  </section>

  <section>
    <h2>Live messages</h2>
    <div class="filter-row">
      <select id="chat-filter" title="Filter by chat"><option value="">All chats</option></select>
    </div>
    <div id="msg-list"><div class="empty">Connect a session to see messages</div></div>
    <form id="send-form">
      <input id="send-chat" placeholder="chatId, e.g. 628123456@s.whatsapp.net" autocomplete="off">
      <input id="send-text" placeholder="message text" autocomplete="off">
      <button type="submit" class="primary">Send</button>
    </form>
  </section>
</main>

<div id="notice"></div>

<script src="vendor/qrcode.min.js"></script>
<script>
'use strict';

/* ---------- config ---------- */
const LS_URL = 'openwa:worker-url', LS_TOKEN = 'openwa:worker-token';
let base = (localStorage.getItem(LS_URL) || '').replace(/\/+$/, '');
let token = localStorage.getItem(LS_TOKEN) || '';

const $ = id => document.getElementById(id);
const apiBase = () => base || location.origin;

function saveConfig() {
  base = $('cfg-url').value.trim().replace(/\/+$/, '');
  token = $('cfg-token').value.trim();
  localStorage.setItem(LS_URL, base);
  localStorage.setItem(LS_TOKEN, token);
  notice('Config saved' + (base ? ` · ${base}` : ' · same origin'));
  loadSessions();
}
$('cfg-url').value = base;
$('cfg-token').value = token;
$('cfg-save').addEventListener('click', saveConfig);

let noticeTimer = null;
function notice(msg) {
  const el = $('notice');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

/* ---------- api ---------- */
async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (token) headers['x-api-key'] = token;
  const res = await fetch(apiBase() + path, { ...opts, headers });
  const body = await res.text().catch(() => '');
  if (!res.ok) throw new Error(`${res.status} ${body || res.statusText}`.trim().slice(0, 300));
  return body ? JSON.parse(body) : null;
}

/* ---------- state ---------- */
let current = null;          // selected session id
let ws = null;
let wsRetry = 0;
let wsTimer = null;

/* ---------- sessions ---------- */
let sessionsLoaded = false;

async function loadSessions() {
  try {
    const { sessions } = await api('/api/sessions');
    sessionsLoaded = true;
    const list = $('session-list');
    const rows = new Map();
    for (const row of list.querySelectorAll('.session')) rows.set(row.dataset.id, row);
    const seen = new Set();
    for (const s of sessions) {
      seen.add(s.id);
      let row = rows.get(s.id);
      if (!row) {
        row = document.createElement('div');
        row.className = 'session';
        row.dataset.id = s.id;
        row.innerHTML =
          '<span class="name"></span><span class="chip"></span>' +
          '<button class="del" title="Delete session">✕</button>';
        row.querySelector('.name').addEventListener('click', () => selectSession(s.id));
        row.querySelector('.del').addEventListener('click', e => {
          e.stopPropagation();
          if (confirm(`Delete session "${s.id}"? This wipes its WhatsApp credentials.`)) {
            deleteSession(s.id);
          }
        });
        list.appendChild(row);
      }
      row.classList.toggle('active', s.id === current);
      row.querySelector('.name').textContent = s.id;
      const chip = row.querySelector('.chip');
      chip.textContent = s.status;
      chip.className = `chip ${s.status}`;
    }
    for (const [id, row] of rows) if (!seen.has(id)) row.remove();
    if (!sessions.length) {
      list.innerHTML = '<div class="empty">No sessions yet — create one above</div>';
    }
  } catch (err) {
    // silent on the poll loop — a misconfigured URL is already surfaced by the first load
    if (!sessionsLoaded) notice(`Sessions: ${err.message}`);
  }
}

async function createSession(name) {
  try {
    const res = await api('/api/sessions', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    notice(`Session "${res.id}" created`);
    await loadSessions();
    selectSession(res.id);
  } catch (err) {
    notice(`Create: ${err.message}`);
  }
}

async function deleteSession(id) {
  try {
    await api(`/api/sessions/${encodeURIComponent(id)}`, { method: 'DELETE' });
    if (current === id) { current = null; disconnectEvents(); $('session-view').hidden = true; }
    notice(`Session "${id}" deleted`);
    await loadSessions();
  } catch (err) {
    notice(`Delete: ${err.message}`);
  }
}

/* ---------- session view ---------- */
async function selectSession(id) {
  current = id;
  document.querySelectorAll('.session').forEach(r => r.classList.toggle('active', r.dataset.id === id));
  $('session-view').hidden = false;
  $('session-title').textContent = id;
  await loadHistory();
  connectEvents();
  await refreshStatus();
}

async function loadHistory() {
  if (!current) return;
  const list = $('msg-list');
  list.innerHTML = '<div class="empty">Loading history…</div>';
  try {
    const { messages } = await api(`/api/sessions/${encodeURIComponent(current)}/history`);
    list.innerHTML = '';
    if (!messages.length) {
      list.innerHTML = '<div class="empty">Listening…</div>';
    }
    // messages arrive newest-first; append in that order so the newest sits on top
    const frag = document.createDocumentFragment();
    for (const m of messages) frag.appendChild(buildMessage(m));
    list.appendChild(frag);
  } catch (err) {
    list.innerHTML = '<div class="empty">Listening…</div>';
    notice(`History: ${err.message}`);
  }
  updateChatFilter();
}

async function refreshStatus() {
  if (!current) return;
  try {
    const st = await api(`/api/sessions/${encodeURIComponent(current)}/status`);
    renderStatus(st);
  } catch (err) {
    notice(`Status: ${err.message}`);
  }
}

async function startSession() {
  if (!current) return;
  try {
    await api(`/api/sessions/${encodeURIComponent(current)}/start`, { method: 'POST' });
    notice('Waking session — socket stays open for a short window, then goes idle');
    await refreshStatus();
  } catch (err) {
    notice(`Start: ${err.message}`);
  }
}

async function logoutSession() {
  if (!current || !confirm(`Log out "${current}"? The device link is removed and credentials are wiped.`)) return;
  try {
    await api(`/api/sessions/${encodeURIComponent(current)}/logout`, { method: 'POST' });
    notice('Logged out');
    await loadSessions();
    await refreshStatus();
  } catch (err) {
    notice(`Logout: ${err.message}`);
  }
}

/* ---------- events websocket ---------- */
function connectEvents() {
  if (!current) return;
  clearTimeout(wsTimer);
  const url = apiBase() + `/api/sessions/${encodeURIComponent(current)}/events` +
    (token ? `?token=${encodeURIComponent(token)}` : '');
  try { ws && ws.close(); } catch {}
  ws = new WebSocket(url);
  ws.onopen = () => { wsRetry = 0; };
  ws.onmessage = e => {
    try { handleEvent(JSON.parse(e.data)); } catch { /* ignore malformed frames */ }
  };
  ws.onclose = () => scheduleReconnect();
  ws.onerror = () => { try { ws.close(); } catch {} };
}

function scheduleReconnect() {
  clearTimeout(wsTimer);
  const delay = Math.min(30000, 1000 * 2 ** wsRetry++);
  wsTimer = setTimeout(connectEvents, delay);
}

function disconnectEvents() {
  clearTimeout(wsTimer);
  if (ws) { try { ws.close(); } catch {} ws = null; }
}

function handleEvent({ type, data }) {
  if (type === 'connection.update') renderStatus(data);
  else if (type === 'message') addMessage(data);
}

/* ---------- rendering ---------- */
function renderStatus(st) {
  const chip = $('status-chip');
  chip.textContent = st.status;
  chip.className = `chip ${st.status}`;
  const qrPanel = $('qr-panel');
  if (st.qr && typeof qrcode === 'function') {
    try {
      const qr = qrcode(0, 'M');
      qr.addData(st.qr);
      qr.make();
      $('qr-img').src = qr.createDataURL(6, 4);
      qrPanel.hidden = false;
      $('conn-note').textContent = '';
      return;
    } catch (err) {
      notice(`QR render: ${err.message}`);
    }
  }
  if (st.status === 'connected') {
    qrPanel.hidden = true;
    $('conn-note').textContent = `Connected as ${st.me?.id ?? 'unknown'}`;
  } else if (st.status === 'idle') {
    qrPanel.hidden = true;
    $('conn-note').textContent = 'Idle — no socket held. Wake it (or let the poller drain) to reconnect.';
  } else if (st.status === 'new' || st.status === 'closed') {
    qrPanel.hidden = true;
    $('conn-note').textContent = st.status === 'closed' && st.lastDisconnect
      ? `Disconnected (${st.lastDisconnect.code ?? '?'}) — ${st.lastDisconnect.message ?? ''}`
      : 'Session not started — press Wake';
  } else {
    qrPanel.hidden = true;
    $('conn-note').textContent = st.status;
  }
}

const MSG_TYPES = {
  conversation: 'text', extendedTextMessage: 'text', imageMessage: 'image',
  videoMessage: 'video', audioMessage: 'audio', documentMessage: 'document',
  stickerMessage: 'sticker', locationMessage: 'location', contactMessage: 'contact',
  reactionMessage: 'reaction', protocolMessage: 'protocol',
};

function buildMessage(m) {
  const el = document.createElement('div');
  el.className = 'msg';
  el.dataset.chat = m.chatId || '';
  const when = m.timestamp ? new Date(m.timestamp).toLocaleTimeString() : '';
  const type = MSG_TYPES[m.type] || m.type || 'message';
  const kind = m.fromMe ? '<span class="from-me">you</span>' : escapeHtml(m.pushName || m.sender || 'them');
  el.innerHTML = `
    <div class="meta">
      <span>${kind}</span>
      <span>${escapeHtml(m.chatId || '')}</span>
      ${m.fromMe ? '' : `<span class="type-tag">${escapeHtml(type)}</span>`}
      <span>${when}</span>
    </div>
    <div class="text">${m.text ? escapeHtml(m.text) : `<span class="type-tag">[${escapeHtml(type)}]</span>`}</div>`;
  return el;
}

function addMessage(m) {
  const list = $('msg-list');
  const empty = list.querySelector('.empty');
  if (empty) list.innerHTML = '';
  list.prepend(buildMessage(m));
  while (list.children.length > 300) list.lastElementChild.remove(); // bound the DOM
  updateChatFilter();
}

/* ---------- chat filter ---------- */
$('chat-filter').addEventListener('change', applyChatFilter);

function updateChatFilter() {
  const select = $('chat-filter');
  const previous = select.value;
  const chats = new Set();
  for (const el of document.querySelectorAll('#msg-list .msg')) {
    if (el.dataset.chat) chats.add(el.dataset.chat);
  }
  const sorted = [...chats].sort();
  const same =
    select.options.length - 1 === sorted.length &&
    [...select.options].slice(1).every((o, i) => o.value === sorted[i]);
  if (!same) {
    select.innerHTML =
      '<option value="">All chats</option>' +
      sorted.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    if ([...select.options].some(o => o.value === previous)) select.value = previous;
  }
  applyChatFilter();
}

function applyChatFilter() {
  const want = $('chat-filter').value;
  for (const el of document.querySelectorAll('#msg-list .msg')) {
    el.style.display = want && el.dataset.chat !== want ? 'none' : '';
  }
}

/* ---------- send ---------- */
$('send-form').addEventListener('submit', async e => {
  e.preventDefault();
  const chatId = $('send-chat').value.trim();
  const text = $('send-text').value.trim();
  if (!current || !chatId || !text) return;
  try {
    const res = await api(`/api/sessions/${encodeURIComponent(current)}/send-text`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ chatId, text }),
    });
    notice(`Sent (${res.id})`);
    $('send-text').value = '';
    addMessage({ id: res.id, chatId, fromMe: true, text, timestamp: new Date().toISOString(), type: 'conversation' });
  } catch (err) {
    notice(`Send: ${err.message}`);
  }
});

/* ---------- wiring ---------- */
$('create-form').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('new-name').value.trim();
  if (name) { createSession(name); $('new-name').value = ''; }
});
$('btn-start').addEventListener('click', startSession);
$('btn-refresh').addEventListener('click', refreshStatus);
$('btn-logout').addEventListener('click', logoutSession);

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

loadSessions();
setInterval(loadSessions, 5000); // auto-refresh the session list / status chips
</script>
</body>
</html>
